# DEMO ONLY — a privilege escalation that keeps the same image.
#
# Under the retired hash protocol v1 this file was undetectable: every field v1
# hashed is byte-identical to demo-deployment.yaml (namespace, name, labels,
# replicas, selector, pod template labels, container name, image, env NAMES,
# and resources), so it produced the same config hash and pod-verify said PASS.
#
# Under v2, which the operator now publishes, it hashes DIFFERENTLY and
# pod-verify reports FAIL: v2 covers the command, init containers, security
# context, host namespaces, volumes and ServiceAccount changed below. The
# "NOT hashed" notes on individual fields describe v1.
#
# The changed LOG_LEVEL value is still invisible under v2: literal env values
# are not hashed. See README "What PASS means".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: overprivileged
  namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # NOT hashed: a different identity in the cluster.
      serviceAccountName: overprivileged
      # NOT hashed: host namespace access.
      hostPID: true
      # NOT hashed: an init container that could do anything before the app runs.
      initContainers:
        - name: setup
          image: busybox:1.36
          command: ["sh", "-c", "echo 'this init step is invisible to the config hash'"]
      containers:
        - name: server
          image: registry.k8s.io/pause@sha256:7031c1b283388d2c2e09b57badb803c05ebed362dc88d84b480cc47f72a21097
          # NOT hashed: a different program entirely, from the same image.
          command: ["/pause"]
          args: ["--not-what-was-reviewed"]
          env:
            # Name is hashed; the VALUE is excluded by design so Secrets never
            # reach the chain. Changing it is invisible to the hash.
            - name: LOG_LEVEL
              value: trace
          # NOT hashed: privilege escalation.
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
          # NOT hashed: the host root filesystem, mounted read-write.
          volumeMounts:
            - name: hostroot
              mountPath: /host
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: hostroot
          hostPath:
            path: /
