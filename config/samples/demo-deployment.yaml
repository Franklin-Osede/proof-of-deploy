# A trivial workload for the local demo. Nothing here is special: the operator
# attests any Deployment it can read. It is deliberately small so the attested
# surface is easy to reason about, and so a deliberate change (see the demo
# runbook) visibly flips pod-verify from PASS to FAIL.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: server
          # Pinned by digest on purpose: the config hash covers the image
          # STRING, so a floating tag would let the bytes change underneath an
          # unchanged hash. See README "What fields are excluded and why".
          image: registry.k8s.io/pause@sha256:7031c1b283388d2c2e09b57badb803c05ebed362dc88d84b480cc47f72a21097
          env:
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
