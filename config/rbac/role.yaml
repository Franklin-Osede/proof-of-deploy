apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
  labels:
    app.kubernetes.io/name: proof-of-deploy
# The operator is a passive observer. It has READ-ONLY access to Deployments and
# no write verbs anywhere. This is the RBAC expression of "never block, never
# mutate deployments".
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
