name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go-version-file pins the toolchain to the `go` directive in go.mod.
      # The config hash is a wire format, so the toolchain that produces it is
      # part of the protocol's reproducibility story, not just build hygiene.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go.mod / go.sum are tidy and committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Fails on a formatting difference rather than rewriting the checkout.
      - name: gofmt
        run: make fmt-check

      - name: vet
        run: make vet

      - name: build
        run: make build

      - name: test
        run: make test

      # The publisher is a concurrent state machine whose whole job is to not
      # publish twice. Data races there would be invisible in ordinary runs.
      - name: race detector
        run: go test -race ./internal/publisher/... ./internal/controller/...

      # The v2 golden vectors are pinned by Go tests that use the same encoder
      # they are checking, which proves determinism but not correctness. This
      # re-derives them with an independent implementation written from the
      # documented layout. Cheap, and it is the only check that would catch the
      # encoder and its vectors being wrong together.
      - name: v2 vectors match the independent reference implementation
        run: python3 internal/attest/testdata/_envelope_v2/reference.py --check

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: hardhat test
        working-directory: contracts
        run: |
          npm ci
          npm test

      # Runs here rather than in the Go job because it needs the compiled
      # artifact, which only exists once Hardhat has run. The Go job skips these
      # for that reason, so this is the step that actually enforces them.
      - name: Go ABI matches the compiled contract
        run: go test ./internal/chain -run 'TestABIMatchesCompiledArtifact|TestEveryABIConstantIsGuarded' -v

      # The round trip needs a real EVM: decoding alone could pass while the
      # encoding side is wrong. go-ethereum's in-process simulated backend is
      # not usable (github.com/fjl/memsize does not link on current toolchains),
      # so a throwaway Hardhat node stands in. Without this step the test would
      # skip in CI and never actually run anywhere.
      - name: chain client round trip and publish outcomes against a real node
        working-directory: contracts
        run: |
          npx hardhat node > /tmp/hardhat-node.log 2>&1 &
          curl -s --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 \
            -X POST -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
            http://127.0.0.1:8545 >/dev/null
          cd ..
          TEST_ETH_RPC_URL=http://127.0.0.1:8545 \
          TEST_ETH_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
            go test ./internal/chain -run 'TestV2RoundTrip|TestPublishAndWait|TestPrepare|TestPreparing|TestResending' -v
